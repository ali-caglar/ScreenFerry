name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          # A PAT lets the release PR trigger CI; GITHUB_TOKEN-created PRs do not (see docs/BRIEF.md §8).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  macos:
    name: macOS artifact
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-26
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Compute version
        run: echo "VERSION=$(scripts/version.sh)" >> "$GITHUB_ENV"
      - name: Build app
        run: |
          xcodebuild build \
            -project apps/macos/ScreenFerry.xcodeproj \
            -scheme ScreenFerry \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"
      - name: Package
        run: |
          mkdir -p dist
          ditto -c -k --keepParent build/DerivedData/Build/Products/Release/ScreenFerry.app \
            "dist/ScreenFerry-$VERSION-macos-unsigned.zip"
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  windows:
    name: Windows artifacts
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: windows-2025
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: apps/windows/global.json
      - name: Compute version
        run: echo "VERSION=$(scripts/version.sh)" >> "$GITHUB_ENV"
      - name: Restore
        run: dotnet restore apps/windows/ScreenFerry.sln --locked-mode
      - name: Publish and package
        run: |
          mkdir -p dist
          for rid in win-x64 win-arm64; do
            dotnet publish apps/windows/src/ScreenFerry.App -c Release -r "$rid" --self-contained false \
              --no-restore -p:Version="$VERSION" -o "publish/$rid"
            pwsh -NoProfile -Command "Compress-Archive -Path 'publish/$rid/*' -DestinationPath 'dist/ScreenFerry-$VERSION-$rid-unsigned.zip'"
          done
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
