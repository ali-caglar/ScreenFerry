name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          # A PAT lets the release PR trigger CI; GITHUB_TOKEN-created PRs do not (see docs/BRIEF.md §8).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  macos:
    name: macOS artifact
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-26
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Compute version
        run: echo "VERSION=$(scripts/version.sh)" >> "$GITHUB_ENV"
      - name: Build app
        run: |
          xcodebuild build \
            -project apps/macos/ScreenFerry.xcodeproj \
            -scheme ScreenFerry \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"
      # Ad-hoc, until Developer ID signing exists (ADR 0008).
      - name: Sign ad hoc and package
        run: |
          app=build/DerivedData/Build/Products/Release/ScreenFerry.app
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          mkdir -p dist
          ditto -c -k --keepParent "$app" "dist/ScreenFerry-$VERSION-macos-unsigned.zip"
      # Sparkle feed for automatic updates (ADR 0009); skipped without the key.
      - name: Write appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "::warning::SPARKLE_ED_PRIVATE_KEY is not set; no appcast, so Macs won't see this release as an update."
            exit 0
          fi
          zip="ScreenFerry-$VERSION-macos-unsigned.zip"
          signature=$(printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | \
            build/DerivedData/SourcePackages/artifacts/sparkle/Sparkle/bin/sign_update --ed-key-file - "dist/$zip")
          cat > dist/appcast.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>ScreenFerry</title>
              <item>
                <title>ScreenFerry $VERSION</title>
                <link>https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG</link>
                <sparkle:version>$GITHUB_RUN_NUMBER</sparkle:version>
                <sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>13.0</sparkle:minimumSystemVersion>
                <pubDate>$(date -R)</pubDate>
                <enclosure url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$zip" $signature type="application/octet-stream"/>
              </item>
            </channel>
          </rss>
          XML
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  windows:
    name: Windows artifacts
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: windows-2025
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: apps/windows/global.json
      - name: Compute version
        run: echo "VERSION=$(scripts/version.sh)" >> "$GITHUB_ENV"
      - name: Restore
        run: dotnet restore apps/windows/ScreenFerry.sln --locked-mode
      - name: Publish
        run: |
          # Self-contained single files need no .NET runtime (ADR 0008); left uncompressed for the
          # installer's LZMA (ADR 0010). Restore above already enforced the lock files.
          for arch in x64 arm64; do
            dotnet publish apps/windows/src/ScreenFerry.App -c Release -r "win-$arch" --self-contained \
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
              -p:Version="$VERSION" -o "publish/$arch"
          done
      - name: Build installers
        shell: pwsh
        run: |
          foreach ($arch in 'x64', 'arm64') {
            & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DVersion=$env:VERSION" "/DArch=$arch" "/DSource=$PWD\publish\$arch\ScreenFerry.exe" /Odist apps\windows\installer\ScreenFerry.iss
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      # Update manifest for the Windows agent (ADR 0009); skipped without the key.
      - name: Write update manifest
        env:
          WINDOWS_UPDATE_KEY: ${{ secrets.WINDOWS_UPDATE_KEY }}
        run: |
          if [ -z "$WINDOWS_UPDATE_KEY" ]; then
            echo "::warning::WINDOWS_UPDATE_KEY is not set; no update manifest, so PCs won't see this release as an update."
            exit 0
          fi
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$WINDOWS_UPDATE_KEY" > "$key"
          assets=""
          for arch in x64 arm64; do
            setup="ScreenFerry-$VERSION-windows-$arch-setup.exe"
            sha=$(sha256sum "dist/$setup" | cut -d' ' -f1)
            sig=$(openssl dgst -sha256 -sign "$key" "dist/$setup" | base64 -w0)
            url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$setup"
            assets="$assets${assets:+,}\"win-$arch\":{\"url\":\"$url\",\"sha256\":\"$sha\",\"signature\":\"$sig\"}"
          done
          printf '{"version":"%s","assets":{%s}}\n' "$VERSION" "$assets" > dist/windows-update.json
          jq . dist/windows-update.json
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
