version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: /apps/windows
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      test:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk"]

  - package-ecosystem: swift
    directory: /apps/macos/ScreenFerryKit
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: npm
    directory: /protocol
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
